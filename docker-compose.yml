services:
  survey:
    build: .
    image: surveyapp:latest
    container_name: surveyapp
    restart: unless-stopped
    ports:
      # غيّر 8080 اليسرى لو المنفذ مشغول على السيرفر.
      - "8080:8080"
    environment:
      # كلمة مرور لوحة الإدارة — غيّرها في ملف .env قبل الرفع.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?لازم تعيّن ADMIN_PASSWORD في ملف .env}
      DB_PATH: /data/survey.db
      ADDR: ":8080"
    volumes:
      # البيانات تبقى على السيرفر حتى لو حُذفت الحاوية.
      - ./data:/data
    healthcheck:
      test: ["CMD", "/surveyapp", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # حدود متواضعة تكفي التطبيق وتمنعه من مزاحمة بقية خدمات السيرفر.
    deploy:
      resources:
        limits:
          memory: 128M
